name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/OneUI9-Resource-Monitor.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OneUI9-Resource-Monitor-APK
        path: release-apk/OneUI9-Resource-Monitor.apk

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v1.2.0 release-apk/OneUI9-Resource-Monitor.apk \
          --title "Galaxy One UI 9 Resource Monitor v1.2.0" \
          --notes "### Galaxy One UI 9 Native Single-Dashboard v1.2.0
          
          - **Unified 1-Page Dashboard**: Removed separate Task Manager tabs for seamless one-glance monitoring.
          - **CPU Load & 8-Core Frequencies**: Real-time Snapdragon 8-core clock & load %.
          - **GPU Adreno 710 Monitor**: Real-time GPU load %, Clock MHz, and GPU temperature.
          - **Active Process Breakdown**: Live breakdown of top applications consuming resources.
          - **Battery & Thermal**: Decimal temperature (°C), live current (mA), voltage.
          - **RAM & Memory**: RAM allocation gauge + 1-tap memory cleaner.
          - **Quick System Shortcut**: 1-tap shortcut to Samsung's native Running Services screen." \
          --target main || true
