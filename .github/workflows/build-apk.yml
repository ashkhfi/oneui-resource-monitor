name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/OneUI9-Resource-Monitor.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OneUI9-Resource-Monitor-APK
        path: release-apk/OneUI9-Resource-Monitor.apk

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v1.1.0 release-apk/OneUI9-Resource-Monitor.apk \
          --title "Galaxy One UI 9 Resource Monitor & Task Manager v1.1.0" \
          --notes "### Galaxy One UI 9 Native Resource Monitor & Task Manager v1.1.0
          
          - **New Feature: PC-Style Task Manager**: View currently active processes and running apps.
          - **Process Management**: Tap any process to view memory usage or Force Stop.
          - **Real-time Filter & Search**: Search active apps by name or package.
          - **Hardware Dashboard**: Live decimal battery temp (°C), mA current, RAM, and Storage.
          - **Pure Native**: 100% Free, Zero Ads, Zero Background Drain." \
          --target main || true
