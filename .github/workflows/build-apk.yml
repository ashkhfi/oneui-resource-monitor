name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/OneUI9-Resource-Monitor.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OneUI9-Resource-Monitor-APK
        path: release-apk/OneUI9-Resource-Monitor.apk

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v2.0.0 release-apk/OneUI9-Resource-Monitor.apk \
          --title "Galaxy Suite One UI Optimizer & Monitor v2.0.0" \
          --notes "### Galaxy Suite: Flagship One UI 9 Optimizer & Monitor v2.0.0
          
          A premier, ad-free, all-in-one utility suite crafted specifically for Samsung Galaxy devices running One UI 9 / Android 17.
          
          #### 🌟 4 Dedicated Menus (Bottom Navigation):
          1. **📊 Hardware Monitor**: Real-time Snapdragon 8-Core frequencies & load, Adreno 710 GPU status, RAM allocation, and active process breakdown.
          2. **🔋 Battery Guardian**: 80% charge limiter alarm, thermal overheat protection, live wattage (W) and current (mA), 99% SOH tracking.
          3. **❄️ One UI Debloater**: Visual app freezer for Facebook, Microsoft, and Samsung bloatware with real-time RAM savings indicators.
          4. **🧹 Storage Cleaner**: Zero-ad deep cleaner for cache, empty folders, and temporary junk files.
          
          - **UI/UX**: Strictly polished One UI 9 design, AMOLED dark theme, zero overlapping components, 100% free forever." \
          --target main || true
