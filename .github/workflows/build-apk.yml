name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/OneUI9-Resource-Monitor.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OneUI9-Resource-Monitor-APK
        path: release-apk/OneUI9-Resource-Monitor.apk

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v2.1.0 release-apk/OneUI9-Resource-Monitor.apk \
          --clobber \
          --title "Galaxy Suite One UI Optimizer & Monitor v2.1.0" \
          --notes "### Galaxy Suite: Flagship One UI 9 Optimizer & Monitor v2.1.0
          
          A premier, ad-free, all-in-one utility suite crafted specifically for Samsung Galaxy devices running One UI 9 / Android 17.
          
          #### 🎨 Major UI/UX Overhaul & Polish:
          - **One UI 9 Native Navigation Bar**: Fixed bottom navigation styling with native tint states, eliminated cramped/overlapping labels, and aligned seamlessly above system gesture navigation bar with full window insets support.
          - **Zero Component Overlaps**: Fixed all header, badge, button, and switch layouts to guarantee 100% responsive spacing on all screen sizes and font scales.
          - **Modular Dual-Cluster Snapdragon Visualizer**: Clear visual grouping for Efficiency Cores (C0-3) and Performance Cores (C4-7).
          - **100% Ad-Free, Lightweight, and Zero Trackers**." \
          --target main || true
